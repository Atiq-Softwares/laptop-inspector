version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Later releases changed licensing. Require explicit legal approval, not a blind upgrade.
      - dependency-name: PDFsharp-WPF
        versions: [">=6.5.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
